         The app uses a Dashboard Layout. 
         - Sidebar (Right): For navigation between the main "Issues" (Chapters).
         - Main Content Area (Left): Displays the selected module.
         - Modules: 
            1. Overview (Intro & Importance).
            2. Thematic Chapters (Population, Human Rights, Environment, Corruption).
            3. Synthesis (Summary & Key Takeaways).
         - Interaction: Users click sidebar items to swap content dynamically without reloading. Within chapters, interactive accordions and simple quizzes engage the learner.
    -->
    <!-- Visualization & Content Choices:
         - Charts: Used for Population Growth and Environmental stats to visualize the magnitude of issues (Goal: Inform/Compare).
         - Cards/Grids: Used for "Causes vs Effects" to break down dense text into digestible chunks (Goal: Organize).
         - Interaction: Simple tab switching and visibility toggles to prevent cognitive overload.
         - Justification: Charts make abstract numbers concrete. Interactivity keeps the student active rather than passive reading.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

        // --- CHART CONFIGURATIONS ---
        function renderCharts(pageId) {
            // Destroy existing charts to prevent canvas reuse errors is not strictly needed with explicit ID checks, 
            // but good practice if we were reusing canvas IDs. Here we have unique IDs per section.
            
            if (pageId === 'population') {
                const ctx = document.getElementById('popDimChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['النمو السكاني المرتفع', 'سوء التوزيع الجغرافي', 'تدني الخصائص (التعليم/الصحة)'],
                        datasets: [{
                            data: [40, 35, 25], // Approximate weight of focus in curriculum
                            backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { family: 'Amiri', size: 14 } } }
                        }
                    }
                });
            } else if (pageId === 'environment') {
                const ctx = document.getElementById('envChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['الطاقة والصناعة', 'النقل والمواصلات', 'حرق المخلفات', 'الزراعة'],
                        datasets: [{
                            label: 'نسبة المساهمة في الانبعاثات (تقديري)',
                            data: [45, 25, 15, 15],
                            backgroundColor: '#10b981',
                            borderRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { titleFont: { family: 'Cairo' }, bodyFont: { family: 'Cairo' } }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        }

        // --- CORE LOGIC ---
        const mainContent = document.getElementById('main-content');
        const desktopNav = document.getElementById('desktop-nav');
        const mobileNavList = document.getElementById('mobile-nav-list');
        const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
        const mobileNavContent = document.getElementById('mobile-nav-content');

        // Render Nav Items
        const navKeys = Object.keys(appData);
        navKeys.forEach(key => {
            const item = appData[key];
            const btnHtml = `
                <button onclick="loadContent('${key}')" id="nav-${key}" class="nav-item w-full text-right px-4 py-3 rounded-lg hover:bg-gray-100 transition flex items-center gap-3 text-gray-700">
                    <span class="text-xl">${item.icon}</span>
                    <span class="font-medium">${item.title}</span>
                </button>
            `;
            desktopNav.innerHTML += btnHtml;
            mobileNavList.innerHTML += btnHtml;
        });

        // Load Content Function
        function loadContent(key) {
            // Update UI Active State
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-nav'));
            document.querySelectorAll(`#nav-${key}`).forEach(el => el.classList.add('active-nav'));

            // Inject Content
            mainContent.innerHTML = appData[key].content;
            
            // Scroll to top
            mainContent.scrollTop = 0;

            // Render Charts if exist
            setTimeout(() => renderCharts(key), 100);

            // Close mobile menu if open
            closeMobileMenu();
        }

        // Sub-tab logic for Corruption section
        window.toggleCorruptionTab = function(tab) {
            const corrContent = document.getElementById('content-corr');
            const rumorsContent = document.getElementById('content-rumors');
            const tabCorr = document.getElementById('tab-corr');
            const tabRumors = document.getElementById('tab-rumors');

            if (tab === 'corr') {
                corrContent.classList.remove('hidden');
                rumorsContent.classList.add('hidden');
                
                tabCorr.classList.add('border-b-2', 'border-red-600', 'font-bold', 'text-red-700', 'bg-red-50');
                tabCorr.classList.remove('text-gray-500');
                
                tabRumors.classList.remove('border-b-2', 'border-red-600', 'font-bold', 'text-red-700', 'bg-red-50');
                tabRumors.classList.add('text-gray-500');
            } else {
                corrContent.classList.add('hidden');
                rumorsContent.classList.remove('hidden');

                tabRumors.classList.add('border-b-2', 'border-red-600', 'font-bold', 'text-red-700', 'bg-red-50');
                tabRumors.classList.remove('text-gray-500');

                tabCorr.classList.remove('border-b-2', 'border-red-600', 'font-bold', 'text-red-700', 'bg-red-50');
                tabCorr.classList.add('text-gray-500');
            }
        };

        // Mobile Menu Logic
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const closeMobileNavBtn = document.getElementById('close-mobile-nav');

        function openMobileMenu() {
            mobileNavOverlay.classList.remove('hidden');
            setTimeout(() => {
                mobileNavContent.classList.remove('translate-x-full');
            }, 10);
        }

        function closeMobileMenu() {
            mobileNavContent.classList.add('translate-x-full');
            setTimeout(() => {
                mobileNavOverlay.classList.add('hidden');
            }, 300);
        }

        mobileMenuBtn.addEventListener('click', openMobileMenu);
        closeMobileNavBtn.addEventListener('click', closeMobileMenu);
        mobileNavOverlay.addEventListener('click', (e) => {
            if (e.target === mobileNavOverlay) closeMobileMenu();
        });

        // Initialize App
        loadContent('intro');

    </script>
